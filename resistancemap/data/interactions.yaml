# ResistanceMap ZA — half-life modifier constants (methodology section 5).
# Stage 3 actions the pending_removal items from Stage 2. `status` values:
#   active        — applied to the half-life
#   direction_only — qualitative warning, multiplier 1.0 (no magnitude)
#   no_effect     — recorded, multiplier 1.0, not applied
#   removed       — deleted from the model, kept here as a record
#   disabled      — scaling defined but switched off pending an unsourced input

ruleset_version: "0.5.0"
schema_version: "1.0"

interactions:
  - id: rifampicin_dtg
    trigger: rifampicin
    drug: Dolutegravir
    multiplier: 0.46
    classification: A
    status: active
    methodology_section: "5.1"
    mechanism: "UGT1A1 principal; CYP3A4 minor (<10%). Rifampicin induces UGT1A1, UGT1A9 and CYP3A4."
    source: "Rifampicin reduces DTG AUC ~54% (AUC_rif/AUC_ctrl = 0.46)."
    derivation: >-
      AUC is proportional to 1/CL. AUC_rif/AUC_ctrl = 0.46 => CL_rif/CL_ctrl =
      1/0.46 = 2.174. With volume unchanged, t-half is proportional to 1/CL, so
      t-half_rif/t-half_ctrl = 0.46, giving 14 h * 0.46 = 6.44 h.
    schedule: BD
    dosing_interval_h: 12
    schedule_note: >-
      Management is dolutegravir 50 mg twice daily. Twice-daily with rifampicin
      achieves AUC/trough ~18-33% above once-daily without rifampicin. The curve is
      annotated BD; the model does not simulate the inter-dose sawtooth (section 3.2).
    display_name: "Rifampicin–DTG (UGT1A1 induction)"
    display_desc: "−54% DTG AUC → t½ ×0.46"

  - id: rifampicin_efv
    trigger: rifampicin
    drug: Efavirenz
    multiplier: 1.0
    classification: C
    status: removed
    methodology_section: "5.2"
    source: "Not supported by South African data (Cohen et al., PMC3837290)."
    note: >-
      v4.0 applied 0.74. Removed in Stage 3: SA data support no EFV dose adjustment
      with rifampicin; CYP2B6 516G>T is the dominant determinant of EFV exposure
      locally, more so than the rifampicin interaction.
    display_name: "Rifampicin–EFV"
    display_desc: "no dose adjustment (informational)"

  - id: sjw_dtg
    trigger: st_johns_wort
    herb: "St John's Wort"
    drug: Dolutegravir
    multiplier: 1.0
    classification: B
    status: direction_only
    methodology_section: "5.3"
    source: "Hyperforin induces CYP3A4/P-gp; direction established, magnitude unsourced — TODO."
    note: "Stage 3: qualitative warning only, no percentage applied to the half-life."
    display_name: "St John's Wort–DTG"
    display_desc: "induction — direction only, no magnitude"

  - id: sjw_efv
    trigger: st_johns_wort
    herb: "St John's Wort"
    drug: Efavirenz
    multiplier: 1.0
    classification: B
    status: direction_only
    methodology_section: "5.3"
    source: "Hyperforin induces CYP3A4/P-gp; direction established, magnitude unsourced — TODO."
    note: "Stage 3: qualitative warning only, no percentage applied to the half-life."
    display_name: "St John's Wort–EFV"
    display_desc: "induction — direction only, no magnitude"

  - id: african_potato
    trigger: african_potato
    herb: "African Potato (Hypoxis hemerocallidea)"
    drugs: [Dolutegravir, Efavirenz]
    multiplier: 1.0
    classification: C
    status: no_effect
    methodology_section: "5.4"
    source: "Evidence thin, largely in vitro, inconsistent on direction (some points to inhibition)."
    note: "Stage 3: no modelled effect (multiplier 1.0). Counselling prompt retained."
    display_name: "African Potato"
    display_desc: "no modelled effect; record and counsel"

  - id: renal_tdf_3tc
    trigger: renal
    drugs: [Tenofovir, Lamivudine]
    egfr_reference: 90
    scaling: "t_half_pt = t_half_norm * (egfr_reference / egfr_pt)"
    scaling_enabled: false
    fraction_renally_cleared:
      Tenofovir:
        value: null
        source: "TODO — UNVERIFIED"
      Lamivudine:
        value: null
        source: "TODO — UNVERIFIED"
    classification: C
    status: disabled
    methodology_section: "5.5"
    source: "Per-drug renally-cleared fraction is unsourced (section 5.5)."
    note: >-
      Stage 3: the fixed per-category multipliers are removed. eGFR scaling needs a
      per-drug renally-cleared fraction, which is unsourced, so half-life scaling is
      DISABLED (renal does not modify the resistance model). Renal is presented as a
      standalone accumulation-nephrotoxicity safety alert (section 5.5).
    display_name: "Renal"

  - id: paediatric_weight
    trigger: paediatric
    scope: all
    model: allometric
    reference_weight_kg: 70
    exponent: 0.25
    curve_min_age_months: 6
    classification: B
    status: active
    methodology_section: "5.6"
    source: "Allometric scaling: t-half_child = t-half_adult * (W/70)^0.25 (section 5.6)."
    note: >-
      Replaces the v4.0 linear W/35 factor. At 15 kg gives 0.68 vs the linear 0.43.
      Below curve_min_age_months the allometric model is not applicable (UGT1A1
      maturation) and the decay curve is suppressed as well as leaving dosing to the
      WHO band lookup.
    display_name: "Paediatric Weight-Band (allometric)"

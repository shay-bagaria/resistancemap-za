# ResistanceMap ZA — half-life modifier constants
# Relocated verbatim from calculate_adjusted_half_life() (methodology section 5).
# Stage 2 only moves these constants out of Python; the arithmetic is unchanged.
# `status: active` entries change behaviour now. `status: pending_removal` entries
# record what v4.0 currently applies and name the methodology section that governs
# their replacement in a later stage; their behaviour is unchanged in Stage 2.

ruleset_version: "0.5.0"
schema_version: "1.0"

interactions:
  - id: rifampicin_dtg
    trigger: rifampicin
    drug: Dolutegravir
    multiplier: 0.46
    classification: A
    status: active
    methodology_section: "5.1"
    source: "Rifampicin reduces DTG AUC ~54% via UGT1A1 (principal), UGT1A9 and CYP3A4 (<10%)."
    derived_multiplier: 0.46
    derivation: |
      AUC ∝ 1/CL, and AUC_rif / AUC_control = 0.46 (54% reduction)
      ⇒ CL_rif / CL_control = 1/0.46 = 2.174
      t½ = ln(2)·V/CL, V assumed unchanged
      ⇒ t½_rif = 14 h × 0.46 = 6.4 h
    note: >-
      Section 5.1 derives 0.46 (-> 6.4 h) from the 54% AUC reduction and switches DTG
      to twice-daily dosing on the plotted curve.
    display_name: "Rifampicin UGT1A1/CYP3A4 Induction"
    display_desc: "−54% DTG half-life"
    alert: "Increase dolutegravir to 50 mg twice daily with rifampicin. Note: twice-daily dosing with rifampicin achieves AUC and trough approximately 18–33% above once-daily dosing without rifampicin."

  - id: rifampicin_efv
    trigger: rifampicin
    drug: Efavirenz
    multiplier: 1.0
    classification: C
    status: removed
    methodology_section: "5.2"
    source: "Not supported by South African data (Cohen et al., PMC3837290)."
    note: >-
      Section 5.2: SA data support no dose adjustment; CYP2B6 516G>T is the dominant
      determinant of EFV exposure locally.
    display_name: "Rifampicin CYP3A4 Induction"
    display_desc: "No adjustment (removed)"
    alert: "South African data support use of efavirenz with rifampicin-based tuberculosis treatment without dose adjustment in that population. CYP2B6 516G>T, common locally, is a larger determinant of efavirenz exposure."

  - id: sjw_dtg
    trigger: sjw
    herb: "St John's Wort"
    drug: Dolutegravir
    multiplier: 1.0
    classification: B
    status: direction_only
    methodology_section: "5.3"
    source: "Direction established (hyperforin induces CYP3A4/P-gp); magnitude unsourced — TODO."
    note: "Section 5.3: direction only, magnitude not sourced."
    display_name: "St John's Wort CYP450"
    display_desc: "Direction of effect only"
    alert: "Counsel on St John's Wort interaction (direction of effect only)."

  - id: sjw_efv
    trigger: sjw
    herb: "St John's Wort"
    drug: Efavirenz
    multiplier: 1.0
    classification: B
    status: direction_only
    methodology_section: "5.3"
    source: "Direction established (hyperforin induces CYP3A4/P-gp); magnitude unsourced — TODO."
    note: "Section 5.3: direction only, magnitude not sourced."
    display_name: "St John's Wort CYP450"
    display_desc: "Direction of effect only"
    alert: "Counsel on St John's Wort interaction (direction of effect only)."

  - id: african_potato_dtg
    trigger: african_potato
    herb: "African Potato (Hypoxis hemerocallidea)"
    drug: Dolutegravir
    multiplier: 1.0
    applied: true
    classification: C
    status: active
    methodology_section: "5.4"
    source: "Evidence thin, largely in vitro, not consistently supporting induction."
    note: "Section 5.4: multiplier 1.0 (no modelled effect)."
    display_name: "African Potato CYP450"
    display_desc: "No modelled effect"
    alert: "Counsel on African Potato interaction. Note: evidence is thinner than for St John's Wort, is largely in vitro, and does not consistently support induction, with some findings pointing towards inhibition."

  - id: african_potato_efv
    trigger: african_potato
    herb: "African Potato (Hypoxis hemerocallidea)"
    drug: Efavirenz
    multiplier: 1.0
    applied: true
    classification: C
    status: active
    methodology_section: "5.4"
    source: "Evidence thin, largely in vitro, not consistently supporting induction."
    note: "Section 5.4: multiplier 1.0 (no modelled effect)."
    display_name: "African Potato CYP450"
    display_desc: "No modelled effect"
    alert: "Counsel on African Potato interaction. Note: evidence is thinner than for St John's Wort, is largely in vitro, and does not consistently support induction, with some findings pointing towards inhibition."

  - id: renal_tdf_3tc
    trigger: renal
    drugs: [Tenofovir, Lamivudine]
    eGFR_reference: 90
    classification: C
    status: active
    methodology_section: "5.5"
    source: "Clearance scaling: t½_patient ≈ t½_normal × (eGFR_reference / eGFR_patient)"
    note: "Section 5.5: replaced by eGFR scaling (t-half x eGFR_ref/eGFR). Scaling is disabled until a source for the renally cleared fraction is supplied."
    display_name: "Renal Clearance Delay"

  - id: paediatric_weight
    trigger: paediatric
    scope: all
    model: allometric
    weight_reference_kg: 70
    classification: B
    status: active
    methodology_section: "5.6"
    source: "Allometric: (W/70)^0.25"
    note: "Section 5.6: replaced by allometric (W/70)^0.25 in Stage 3."
    display_name: "Paediatric Weight-Band"

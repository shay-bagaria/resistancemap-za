# ResistanceMap ZA — clinical rules bundle
# See METHODOLOGY.md sections 6, 8, 10, 11 and 12.

ruleset_version: "0.5.0"
schema_version: "1.0"

# Regimen display name -> component drugs (by drug `name` in drugs.yaml).
regimens:
  - display: "TLD (Tenofovir + Lamivudine + Dolutegravir)"
    components: [Tenofovir, Lamivudine, Dolutegravir]
  - display: "TLE (Tenofovir + Lamivudine + Efavirenz)"
    components: [Tenofovir, Lamivudine, Efavirenz]
  - display: "ABC/3TC/DTG (Abacavir + Lamivudine + Dolutegravir)"
    components: [Abacavir, Lamivudine, Dolutegravir]

# Composite score (methodology section 10.2). Hand-chosen weights, class C.
# Restructured in Stage 4: paediatric status removed (being a child is not a
# resistance risk factor); TB and herbal use removed as direct terms (their
# effect already enters through the decay curves; adding them double-counts).
#
# Recalibrated in Stage 5. The Stage 4 bands (0/3/7/11 with weights 3/2/1/1)
# saturated: TLD read "High" at 3, 7 AND 14 days, because state_sev was fed by
# the WORST state reached anywhere in [0, hours_missed], and once a monotherapy
# hour has occurred that stays the worst state forever — no choice of weights
# on that input can separate day 5 from day 14 (both are "worst = monotherapy").
# state_sev now uses the app's CURRENT-state classification instead; the
# cumulative "did this ever happen" signal is still carried by the mutation
# index (§9.2 exposure level 2 = sole active agent at any point), so nothing is
# lost, and the composite can fall again once the regimen has fully cleared —
# correctly, since full clearance is NO_PRESSURE (low selection risk), not the
# peak (methodology §8.1). Weights changed 3/2/1/1 -> 3/1/1/1 and bands
# retuned against the required scenario matrix (TLD 0/1/3/5/7/14 d, TLE
# 0/3/7/14 d, each +/- rifampicin, default labs VL 450 / CD4 280): raw scores
# span {4, 8, 9, 11, 14} and all four bands are reached and ordered — see
# METHODOLOGY.md section 10.2 "as built" for the full table.
composite_score:
  classification: C
  status: active
  methodology_section: "10.2"
  weights:
    state: 3          # w_state × state_severity (current state; monotherapy highest)
    mutation: 1       # w_mut × max mutation index across drugs
    viral_load: 1     # w_vl × viral-load band
    immune: 1         # w_immune × CD4 band
  # Raw weighted sum -> ordinal band (min is the inclusive lower bound). No n/100.
  bands:
    - {min: 0,  label: "Minimal",  colour: "#10b981"}
    - {min: 6,  label: "Low",      colour: "#3b82f6"}
    - {min: 10, label: "Moderate", colour: "#f59e0b"}
    - {min: 13, label: "High",     colour: "#ef4444"}

# RETIRED in Stage 5 (methodology section 11.2). Kept only as the historical
# record of what v4.0/Stages 1-4 scored: unemployment, walking to the clinic, no
# reliable transport, non-disclosure, food insecurity and a taxi strike summed
# into a single "predicted default risk" percentage, with an itemised chart
# showing which disadvantages produced it. No longer read by the application —
# see support_needs below, which replaces it.
adherence_weights:
  classification: C
  status: restructured
  methodology_section: "11.2"
  per_day_missed: 5
  per_km_distance: 0.6
  per_missed_appt: 6
  employment:
    "Employed (formal)": 0
    "Employed (informal)": 5
    "Unemployed": 15
    "Grant recipient": 8
  transport:
    "Private vehicle": 0
    "Taxi/minibus": 8
    "Walking": 18
    "No reliable transport": 25
  taxi_strike: 20
  food_insecurity: 15
  disclosure:
    "Fully disclosed": 0
    "Partially disclosed": 10
    "Non-disclosed": 22
  cap: 100

# Support needs (methodology section 11.2). Class C, hand-chosen trigger
# thresholds. Socio-economic inputs expressed as service entitlements, not a
# risk score: distance/transport/strike -> multi-month dispensing + transport
# support; missed appointments -> CHW contact; food insecurity -> nutritional
# referral. Non-disclosure is deliberately absent from this table: it drives no
# trigger and appears in no entitlement, so it cannot contribute a score or be
# displayed (section 11.1 - safeguarding, intimate-partner-violence risk on a
# screen that may be shared).
support_needs:
  classification: C
  status: active
  methodology_section: "11.2"
  triggers:
    distance_km_threshold: 20   # km; >= this contributes to the transport trigger
    missed_appts_threshold: 2   # in the last 12 months; >= this triggers CHW contact

# KPI-strip laboratory thresholds (methodology section 8 / dashboard).
viral_load_bands:
  undetectable_below: 50      # cp/mL; below this displays "Undetectable"
  high_above: 1000            # cp/mL; above this is the high-viraemia band
cd4_bands:
  severe_below: 200           # cells/uL
  low_below: 350              # cells/uL

paediatric_dtg_dosing:
  classification: A            # Derived — WHO weight-band schedule, methodology section 6
  # Below this age no modelled dose is shown: the source dosing table starts at
  # four weeks of age (~1 month). Neonates <4 weeks fall outside coverage.
  minimum_age_months: 1
  source: >-
    WHO weight-band recommendations for dolutegravir dispersible tablets, as
    reported in the combined IMPAACT P1093 and ODYSSEY population
    pharmacokinetic analysis (PENTA-ID) and the ODYSSEY dosing substudies
    (Waalewijn et al., Lancet HIV 2020; Turkova et al., Lancet HIV 2022). The
    age split within the 6 to <10 kg band follows the IMPAACT P1093 dosing
    table (10 mg from four weeks to under six months; 15 mg from six months).
  # max_kg is the exclusive upper boundary of the weight band; null is open-ended.
  # Each band carries one or more doses. Where a dose depends on age, the entry
  # carries min_age_months / max_age_months (max exclusive); an entry with no age
  # bounds applies across the whole band (subject to minimum_age_months).
  bands:
    - label: "3 to <6 kg"
      min_kg: 3
      max_kg: 6
      doses:
        - dose: "5 mg"
    - label: "6 to <10 kg"
      min_kg: 6
      max_kg: 10
      doses:
        - dose: "10 mg"
          min_age_months: 1
          max_age_months: 6
          source: "IMPAACT P1093 dosing table (4 weeks to <6 months)"
        - dose: "15 mg"
          min_age_months: 6
          source: "WHO weight-band schedule (>=6 months)"
    - label: "10 to <14 kg"
      min_kg: 10
      max_kg: 14
      doses:
        - dose: "20 mg"
    - label: "14 to <20 kg"
      min_kg: 14
      max_kg: 20
      doses:
        - dose: "25 mg"
    - label: ">=20 kg"
      min_kg: 20
      max_kg: null
      doses:
        - dose: "30 mg dispersible, or 50 mg film-coated tablet"
